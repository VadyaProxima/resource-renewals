services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: renewals
      POSTGRES_PASSWORD: renewals_local
      POSTGRES_DB: renewals
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewals -d renewals"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
